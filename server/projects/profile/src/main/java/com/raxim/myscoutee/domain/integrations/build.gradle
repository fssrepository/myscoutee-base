sourceSets {
    main.java {
        srcDirs = [rootProject.canonicalJava]
        include 'com/raxim/myscoutee/domain/integrations/controller/IntegrationReadSupport.java'
        include 'com/raxim/myscoutee/domain/integrations/document/IntegrationToken.java'
        include 'com/raxim/myscoutee/domain/integrations/document/IntegrationWebhookDelivery.java'
        include 'com/raxim/myscoutee/domain/integrations/document/McpAuthorization.java'
        include 'com/raxim/myscoutee/domain/integrations/document/McpEventSubscription.java'
        include 'com/raxim/myscoutee/domain/integrations/document/McpOAuthClient.java'
        include 'com/raxim/myscoutee/domain/integrations/repository/IntegrationTokensRepository.java'
        include 'com/raxim/myscoutee/domain/integrations/repository/IntegrationWebhookDeliveriesRepository.java'
        include 'com/raxim/myscoutee/domain/integrations/repository/McpAuthorizationRepository.java'
        include 'com/raxim/myscoutee/domain/integrations/repository/McpEventSubscriptionsRepository.java'
        include 'com/raxim/myscoutee/domain/integrations/repository/McpOAuthClientsRepository.java'
        include 'com/raxim/myscoutee/domain/integrations/service/McpEventCallbackClient.java'
    }
}

dependencies {
    api project(':platform-api')
    api 'jakarta.annotation:jakarta.annotation-api'
    api 'org.apache.httpcomponents.client5:httpclient5'
    api 'org.springframework.data:spring-data-mongodb'
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-web'
}
